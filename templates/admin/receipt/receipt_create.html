{% extends "layout_admin.html" %}

{% block content %}

{% include 'navbar_admin.html' %}

<div class="container-fluid col-11 m-auto mt-4">

<form method="POST">

<div class="card shadow-sm mb-3">

<div class="card-header fw-semibold">
Novo Recibo
</div>

<div class="card-body">

<div class="row g-3">

<div class="col-md-6">
<label class="form-label">Cliente</label>

<select name="client_id"
        class="form-select form-select-sm"
        required>

<option value="">Selecione</option>

{% for c in clients %}
<option value="{{ c.id }}">
{{ c.name }}
</option>
{% endfor %}

</select>
</div>

<div class="col-md-3">

<label class="form-label">
Forma Pagamento
</label>

<select name="payment_method"
        class="form-select form-select-sm">

<option value="DINHEIRO">Dinheiro</option>
<option value="PIX">PIX</option>
<option value="CARTÃO">Cartão</option>

</select>
</div>

<div class="col-md-3">

<label class="form-label">
Data Emissão
</label>

<input type="date"
       name="issue_date"
       class="form-control form-control-sm"
       max="{{ today_iso }}"
       value="{{ today_iso }}"
       required>

</div>

<div class="col-12">

<label class="form-label">
Observações
</label>

<textarea name="observations"
          class="form-control form-control-sm"></textarea>

</div>

</div>
</div>
</div>

<div class="card shadow-sm">

<div class="card-header d-flex justify-content-between align-items-center">

<span>Itens</span>

<button type="button"
        class="btn btn-success btn-sm"
        id="btn-add">

Adicionar

</button>

</div>

<div class="card-body p-0">

<div class="table-responsive">

<table class="table table-bordered table-sm mb-0">

<thead class="table-light">

<tr>
<th>Categoria</th>
<th>Produto</th>
<th>Nome</th>
<th>Qtde</th>
<th>Valor Unit.</th>
<th>Total</th>
<th></th>
</tr>

</thead>

<tbody id="items-body"></tbody>

<tfoot>

<tr class="table-light">

<td colspan="5" class="text-end fw-bold">
Total Geral:
</td>

<td class="fw-bold text-end"
    id="grand-total">

0,00

</td>

<td></td>

</tr>

</tfoot>

</table>

</div>
</div>
</div>

<div class="mt-3 text-end">

<button type="submit"
        class="btn btn-success">

Gerar Recibo

</button>

</div>

</form>

</div>

<script>

const CATEGORIES = {{ categories | tojson | safe }};

function fmtBR(v){

    return parseFloat(v || 0).toLocaleString(
        'pt-BR',
        {
            minimumFractionDigits:2,
            maximumFractionDigits:2
        }
    );
}

function buildCategoryOptions(){

    let html = '<option value="">Categoria</option>';

    CATEGORIES.forEach(c => {

        html += `
        <option value="${c.id}">
            ${c.name}
        </option>
        `;
    });

    return html;
}

async function loadProducts(categoryId, productSelect){

    productSelect.innerHTML =
        '<option value="">Produto</option>';

    if(!categoryId){
        return;
    }

    const response =
        await fetch(`/admin/receipt/products/${categoryId}`);

    const products = await response.json();

    products.forEach(p => {

        const opt = document.createElement('option');

        opt.value = p.id;

        opt.textContent =
            `${p.name} - R$ ${fmtBR(p.sale_price)}`;

        opt.dataset.price = p.sale_price;

        productSelect.appendChild(opt);
    });
}

function recalc(){

    let grand = 0;

    document.querySelectorAll('.item-row')
    .forEach(row => {

        const qty =
            parseFloat(row.querySelector('.qty').value) || 0;

        const price =
            parseFloat(row.querySelector('.price').value) || 0;

        const total = qty * price;

        row.querySelector('.total-cell')
            .innerText = fmtBR(total);

        grand += total;
    });

    document.getElementById('grand-total')
        .innerText = fmtBR(grand);
}

function newRow(){

    const tr = document.createElement('tr');

    tr.className = 'item-row';

    tr.innerHTML = `

    <td>

        <select name="category_id[]"
                class="form-select form-select-sm cat">

            ${buildCategoryOptions()}

        </select>

    </td>

    <td>

        <select name="product_id[]"
                class="form-select form-select-sm prod"
                required>

            <option value="">Produto</option>

        </select>

    </td>

    <td>

        <input type="text"
               name="description[]"
               class="form-control form-control-sm desc"
               readonly>

    </td>

    <td>

        <input type="number"
               name="quantity[]"
               class="form-control form-control-sm qty"
               value="1"
               min="1">

    </td>

    <td>

        <input type="number"
               name="unit_price[]"
               class="form-control form-control-sm price"
               readonly>

    </td>

    <td class="text-end align-middle total-cell">
        0,00
    </td>

    <td class="text-center">

        <button type="button"
                class="btn btn-danger btn-sm remove">

            X

        </button>

    </td>
    `;

    const cat =
        tr.querySelector('.cat');

    const prod =
        tr.querySelector('.prod');

    const desc =
        tr.querySelector('.desc');

    const qty =
        tr.querySelector('.qty');

    const price =
        tr.querySelector('.price');

    cat.addEventListener('change', async function(){

        await loadProducts(
            this.value,
            prod
        );
    });

    prod.addEventListener('change', function(){

        const opt =
            this.options[this.selectedIndex];

        price.value =
            parseFloat(opt.dataset.price || 0).toFixed(2);

        desc.value =
            opt.textContent;

        recalc();
    });

    qty.addEventListener('input', recalc);

    tr.querySelector('.remove')
    .addEventListener('click', function(){

        tr.remove();

        recalc();
    });

    return tr;
}

document.getElementById('btn-add')
.addEventListener('click', function(){

    document.getElementById('items-body')
        .appendChild(newRow());
});

document.getElementById('items-body')
.appendChild(newRow());

</script>

{% endblock %}
